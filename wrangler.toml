name = "football-platform-api-demo"
main = "src/apps/cloudflare-worker/worker.ts"
compatibility_date = "2026-07-09"
workers_dev = true
keep_vars = true

[secrets]
required = ["DATABASE_URL"]

[[containers]]
class_name = "ApiContainer"
image = "./Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
name = "API_CONTAINER"
class_name = "ApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ApiContainer"]

[observability]
enabled = true
